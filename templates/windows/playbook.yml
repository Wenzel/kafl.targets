- name: Deploy
  hosts: default
  vars:
    vsix_installer: "{{ ansible_env['ProgramFiles'] }}\\Microsoft Visual Studio\\2022\\Community\\Common7\\IDE\\VSIXInstaller.exe"
    wdk_vsix_dir: "{{ ansible_env['ProgramFiles(x86)'] }}\\Windows Kits\\10\\Vsix\\VS2022\\10.0.26100.0\\amd64"
  tasks:
    # This should be set before running the win_inet_proxy module
    - name: Configure IE proxy settings to apply to all users
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\Internet Settings
        name: ProxySettingsPerUser
        data: 0
        type: dword
        state: present
      when: ansible_proxy | length > 0

    - name: Configure IE proxy settings
      win_inet_proxy:
        auto_detect: no
        proxy: "{{ ansible_proxy }}"
      when: ansible_proxy | length > 0

    # This should be done after setting the IE proxy with win_inet_proxy
    - name: Import IE proxy configuration to WinHTTP
      win_http_proxy:
        source: ie
      when: ansible_proxy | length > 0

    - name: Ensure Chocolatey installed from internal repo
      win_chocolatey:
        name: chocolatey
        proxy_url: "{{ ansible_proxy }}"

    - name: Set chocolatey proxy
      win_chocolatey_config:
        name: proxy
        state: present
        value: "{{ ansible_proxy }}"
      when: ansible_proxy | length > 0

    - name: Install OpenSSH Client and Server
      ansible.windows.win_powershell:
        script: |
          Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0

    - name: Set sshd service to start automatically
      win_service:
        name: sshd
        start_mode: auto
        state: started

    - name: Disable uncessary services
      win_service:
        name: "{{ item }}"
        state: stopped
        start_mode: disabled
      with_items:
        - WSearch
        - Spooler

    - name: Disable OneDrive
      win_regedit:
        path: HKLM:\Software\Policies\Microsoft\Windows\OneDrive
        name: DisableFileSyncNGSC
        data: 1
        type: dword
        state: present

    - name: Disable Cortana
      win_regedit:
        path: HKLM:\Software\Policies\Microsoft\Windows\Windows Search
        name: AllowCortana
        data: 0
        type: dword
        state: present

    - name: Disable Defender
      win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Microsoft Defender
        name: DisableAntiSpyware
        data: 1
        type: dword
        state: present

    - name: Download Visual Studio 2022 community installer
      win_get_url:
        url: https://aka.ms/vs/17/release/vs_Community.exe
        dest: "{{ ansible_facts['env']['TEMP'] }}\\vs_community.exe"

    # https://learn.microsoft.com/en-us/visualstudio/install/workload-component-id-vs-community?view=vs-2022&preserve-view=true
    - name: Install Visual Studio Native Desktop Workload
      win_command:
        cmd: vs_community.exe --quiet --wait --norestart --add Microsoft.VisualStudio.Workload.NativeDesktop
      args:
        chdir: "{{ ansible_facts['env']['TEMP'] }}"

    - name: Install Visual Studio VC Tools x86 x64
      win_command:
        cmd: vs_community.exe --quiet --wait --norestart --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64
      args:
        chdir: "{{ ansible_facts['env']['TEMP'] }}"

    - name: Install Windows 11 SDK 10.0.22621.0
      win_command:
        cmd: vs_community.exe --quiet --wait --norestart --add Microsoft.VisualStudio.Component.Windows11SDK.22621
      args:
        chdir: "{{ ansible_facts['env']['TEMP'] }}"

    - name: Install Windows Driver Kit
      win_command:
        cmd: vs_community.exe --quiet --wait --norestart --add Component.Microsoft.Windows.DriverKit
      args:
        chdir: "{{ ansible_facts['env']['TEMP'] }}"

    - name: Download latest WDK for 10.0.22621.0
      win_get_url:
        url: https://go.microsoft.com/fwlink/?linkid=2196230
        dest: "{{ ansible_facts['env']['TEMP'] }}\\wdk_setup.exe"

    - name: Install WDK
      win_command:
        cmd: wdk_setup.exe /q /norestart
      args:
        chdir: "{{ ansible_facts['env']['TEMP'] }}"

    - name: Enable Testsigning
      win_command: Bcdedit.exe -set TESTSIGNING ON

    - name: Download Simics ISPM package
      win_get_url:
        url: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/881ee76a-c24d-41c0-af13-5d89b2a857ff/simics-6-packages-2023-31-win64.ispm
        dest: "{{ ansible_env['USERPROFILE'] }}\\Downloads\\simics-6-packages.ispm"

    - name: Download Intel Simics Package Manager installer
      win_get_url:
        url: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/881ee76a-c24d-41c0-af13-5d89b2a857ff/intel-simics-package-manager-1.7.5-win64.exe
        dest: "{{ ansible_env['USERPROFILE'] }}\\Downloads\\intel-simics-package-manager-win64.exe"

    - name: Install Intel Simics Package Manager silently
      win_command: intel-simics-package-manager-win64.exe /S
      args:
        chdir: "{{ ansible_env['USERPROFILE'] }}\\Downloads"

    - name: Add ISPM to user PATH
      win_environment:
        state: present
        name: Path
        value: "{{ ansible_env['USERPROFILE'] }}\\AppData\\Local\\Programs\\Intel Simics Package Manager"
        level: user
        separator: ';'

    - name: Create Simics install directory in user profile
      win_file:
        path: "{{ ansible_env['USERPROFILE'] }}\\simics"
        state: directory

    - name: Set Simics install directory in ISPM settings
      win_command: ispm.exe settings install-dir "{{ ansible_env['USERPROFILE'] }}\\simics"

    - name: Install Simics bundle
      win_command: >
        ispm.exe packages --install-bundle "{{ ansible_env['USERPROFILE'] }}\Downloads\simics-6-packages-2023-31-win64.ispm"
        --non-interactive --trust-insecure-packages
